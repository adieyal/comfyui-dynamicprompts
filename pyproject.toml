[project]
name = "comfyui-dynamicprompts"
version = "0.3.1"
description = "ComfyUI nodes for Dynamic Prompts: random and combinatorial prompts, wildcards, Jinja2 templates and Magic Prompt."
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "dynamicprompts[yaml]>=0.33.2",
]

[project.urls]
Repository = "https://github.com/adieyal/comfyui-dynamicprompts"

[tool.comfy]
PublisherId = "adieyal"
DisplayName = "Dynamic Prompts"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
    "B",
    "C",
    "COM",
    "E",
    "F",
    "I",
    "UP",
]
ignore = [
    "C901", # Complexity
    "E501", # Line length
    "B019", # functools.lrucache
    "COM812", # Conflicts with ruff format
]
unfixable = [
    "B007", # Loop control variable not used within the loop body
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root is the ComfyUI package (it has an __init__.py with relative imports);
# stop pytest from importing it while looking for conftest files.
addopts = ["--confcutdir=tests"]
